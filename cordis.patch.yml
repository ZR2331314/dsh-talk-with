# dsh-talk-with（剧情向多人格插件）的 bundle 补丁层：把本插件作为一行插进 profile 的条目列表。
#
# 内部路由前缀 /persona-router、数据目录 <DSH_HOME>/persona-router、上下文段名 persona-router:*
# 是历史遗留的技术标识，仅作内部路径使用，与展示名称无关。
#
# name 必须是【裸包名】。dsh-web 的客户端模块扫描只解析裸包名行，
# 靠这一行找到本包的 package.json、读到 dsh.client，才会把 client.js 服务给网页。
- insert:
    - id: talk-with
      name: dsh-talk-with
